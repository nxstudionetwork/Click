# Local development infrastructure. Not for production.
#   docker compose -f infrastructure/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: click
      POSTGRES_PASSWORD: click   # dev only
      POSTGRES_DB: click
    ports: ["5432:5432"]
    volumes: [click-pg:/var/lib/postgresql/data]
volumes:
  click-pg:
